    <link rel="apple-touch-icon" href="/logo-fra.png" />
    
    <!-- Título e Descrição SEO Principal -->
    <title>Memorial França — História Oficial, Conquistas & Membros</title>
    <meta name="description" content="Arquivo histórico oficial da Tropa da França. Conheça as eras, elenco completo de membros, galeria de títulos e a trajetória dos campeões da BGC." />
    <meta name="keywords" content="Memorial França, Memorial Tropa da França, Tropa da França, França BGC, Cidade Alta, GTA RP, França GTA RP" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://memorialfranca.com.br" />
    
    <!-- Open Graph (Prévia para WhatsApp, Discord, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://memorialfranca.com.br" />
    <meta property="og:title" content="Memorial França — História Oficial da Tropa da França" />
    <meta property="og:description" content="Arquivo histórico oficial da Tropa da França. Galeria de troféus, linha do tempo das eras e elenco de membros." />
    <meta property="og:image" content="https://memorialfranca.com.br/banners/banner-trofeu-bgc.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://memorialfranca.com.br" />
    <meta name="twitter:title" content="Memorial França — História Oficial da Tropa da França" />

    <script>
      // Bloquear o menu de contexto (botão direito)
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Bloquear teclas de atalho do desenvolvedor (F12, Ctrl+Shift+I, etc.)
      document.addEventListener('keydown', function(e) {
        // Bloquear F12
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          return false;
        }

        // Bloquear Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (Windows/Linux)
        // Bloquear Cmd+Alt+I, Cmd+Alt+J, Cmd+Alt+C (macOS)
        if (
          (e.ctrlKey || e.metaKey) &&
          (e.shiftKey || e.altKey) &&
          (e.key === 'I' || e.key === 'i' || 
           e.key === 'J' || e.key === 'j' || 
           e.key === 'C' || e.key === 'c' ||
           e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)
        ) {
          e.preventDefault();
          return false;
        }

        // Bloquear Ctrl+U (Windows/Linux) ou Cmd+Alt+U (macOS) - Exibir Código Fonte
        if (
          (e.ctrlKey || e.metaKey) &&
          (e.key === 'U' || e.key === 'u' || e.keyCode === 85)
        ) {
          e.preventDefault();
          return false;
        }
      });
    </script>
  </head>
  <body style="margin: 0; background-color: #080808;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
